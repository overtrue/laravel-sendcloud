name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.3'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --prefer-stable
      - name: Install lowest secure dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
      - name: Audit dependencies
        run: composer audit
      - name: Lint PHP
        run: composer lint
      - name: Run tests
        run: composer test

